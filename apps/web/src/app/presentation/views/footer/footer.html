<footer class="flex flex-col items-center justify-between gap-4 border-t border-border px-4 py-6 text-center text-sm text-muted-foreground sm:flex-row sm:px-6 sm:text-left">
    <p class="text-xs font-text text-muted-foreground font-semibold">{{ message }}</p>

    <div class="flex flex-wrap items-center justify-center gap-2 sm:justify-end">
        <a aria-label="GitHub" ai-button variant="ghost" size="sm" icon="github" target="_blank" [href]="social.github"></a>
        <a aria-label="NPM" ai-button variant="ghost" size="sm" icon="npmjs" target="_blank" rel="noopener noreferrer" [href]="social.npm"></a>
        <a aria-label="LinkedIn" ai-button variant="ghost" size="sm" icon="linkedin" target="_blank" [href]="social.linkedin"></a>
    </div>
</footer>
