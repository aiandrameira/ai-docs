<footer class="flex flex-col items-center justify-between gap-x-4 gap-y-2 border-t border-border px-4 py-4 md:py-2 text-center text-sm text-muted-foreground sm:flex-row sm:px-6 md:px-16 sm:text-left">
    <p class="font-text text-xs font-semibold text-muted-foreground sm:hidden">@aiandralves</p>
    <p class="hidden font-text text-xs font-semibold text-muted-foreground sm:block">{{ message }}</p>

    <div class="flex flex-wrap items-center justify-end gap-2">
        <a aria-label="GitHub" ai-button variant="ghost" size="sm" icon="github" target="_blank" [href]="social.github"></a>
        <a aria-label="NPM" ai-button variant="ghost" size="sm" icon="npmjs" target="_blank" rel="noopener noreferrer" [href]="social.npm"></a>
        <a aria-label="LinkedIn" ai-button variant="ghost" size="sm" icon="linkedin" target="_blank" [href]="social.linkedin"></a>
    </div>
</footer>
