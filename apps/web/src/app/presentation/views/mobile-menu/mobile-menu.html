@if (mobileMenuOpen()) {
<div class="fixed inset-0 z-80 bg-black/45 md:hidden" role="presentation" (click)="close()">
    <aside
        class="absolute inset-y-0 left-0 flex w-70 flex-col overflow-hidden border-r border-border bg-background shadow-[4px_0_24px_rgba(0,0,0,0.12)]"
        aria-label="Menu de navegação"
        (click)="$event.stopPropagation()"
    >
        <div class="flex items-center justify-between px-4 h-14.25 border-b border-border shrink-0">
            <doc-logo />
            <button ai-button variant="ghost" size="xs" (click)="close()" aria-label="Fechar menu" icon="close"></button>
        </div>
        <div class="min-h-0 flex-1 overflow-y-auto" (click)="close()">
            <doc-sidebar />
        </div>
    </aside>
</div>
}
